apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskmanager-app
  labels:
    {{- include "taskmanager.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskmanager-config
  labels:
    {{- include "taskmanager.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: taskmanager
  labels:
    {{- include "taskmanager.labels" . | nindent 4 }}
    app: taskmanager
    role: live
spec:
  selector: { app: taskmanager, color: {{ .Values.activeColor }} }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: taskmanager-preview
  labels:
    {{- include "taskmanager.labels" . | nindent 4 }}
    app: taskmanager
    role: preview
spec:
  selector: { app: taskmanager, color: {{ include "taskmanager.idleColor" . }} }
  ports:
    - { name: http, port: 80, targetPort: http }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskmanager
  labels:
    {{- include "taskmanager.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: taskmanager, port: { name: http } } }
    - host: {{ .Values.ingress.previewHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: taskmanager-preview, port: { name: http } } }
{{- end }}
