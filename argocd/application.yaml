# GitOps: ArgoCD continuously reconciles the cluster with k8s/ on the main branch.
# Jenkins never runs `kubectl apply` against production - it only commits to Git.
#   kubectl apply -f argocd/project.yaml -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskmanager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: taskmanager
  source:
    repoURL: https://github.com/deepanshunegi06/devops-capstone-task-manager.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: taskmanager
  syncPolicy:
    automated:
      prune: true        # resources removed from Git are removed from the cluster
      selfHeal: true     # manual drift (kubectl edit) is reverted to what Git says
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # replicas are owned by the HPA, not by Git
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10
