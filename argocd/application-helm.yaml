# Alternative GitOps source: the Helm chart in helm/taskmanager (bonus).
# Use either this OR application.yaml, not both (they manage the same objects).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskmanager-helm
  namespace: argocd
spec:
  project: taskmanager
  source:
    repoURL: https://github.com/deepanshunegi06/devops-capstone-task-manager.git
    targetRevision: main
    path: helm/taskmanager
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: taskmanager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
