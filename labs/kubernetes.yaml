apiVersion: v1
kind: Namespace
metadata:
  name: orbit-exercise
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-blue
  namespace: orbit-exercise
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: orbit-exercise, color: blue}
  template:
    metadata:
      labels: {app: orbit-exercise, color: blue}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: app
          image: orbit-labs-app:2.0.1
          imagePullPolicy: Never
          env:
            - {name: DATABASE_URL, value: 'sqlite:////tmp/lab.db'}
            - {name: APP_VERSION, value: '2.0.1'}
            - {name: DEPLOY_COLOR, value: blue}
          ports: [{containerPort: 5000, name: http}]
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-live
  namespace: orbit-exercise
spec:
  selector: {app: orbit-exercise, color: blue}
  ports: [{port: 80, targetPort: http}]
