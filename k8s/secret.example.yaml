# TEMPLATE ONLY - real values are never committed to Git.
#
# Option A (lab): create the Secret imperatively before ArgoCD syncs:
#   kubectl create namespace taskmanager
#   kubectl -n taskmanager create secret generic taskmanager-secret \
#     --from-literal=POSTGRES_USER=taskmanager \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_PASSWORD="$(openssl rand -hex 12)"
#   (or run: scripts/create-k8s-secret.sh)
#
# Option B (GitOps-friendly): encrypt it with Bitnami Sealed Secrets and commit the SealedSecret:
#   kubectl create secret generic taskmanager-secret ... --dry-run=client -o yaml \
#     | kubeseal --format yaml > k8s/sealed-secret.yaml
#
# DATABASE_URL is assembled inside the pod from these values (see deployment env).
apiVersion: v1
kind: Secret
metadata:
  name: taskmanager-secret
  namespace: taskmanager
type: Opaque
stringData:
  POSTGRES_USER: "taskmanager"
  POSTGRES_PASSWORD: "<replace-me>"
  SECRET_KEY: "<replace-me>"
  ADMIN_PASSWORD: "<replace-me>"
