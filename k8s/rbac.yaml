# Role-Based Access Control
#  - taskmanager-app : identity the app pods run as. The app never calls the K8s API,
#                      so it gets no permissions and no auto-mounted token.
#  - ci-deployer     : identity Jenkins uses for preview checks - read-only + run a curl pod.
#  - developer       : human read-only access to the namespace (logs, pods, events).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskmanager-app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]          # for the one-off curl preview check
  - apiGroups: [""]
    resources: ["pods/log", "pods/attach"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: taskmanager
roleRef:
  kind: Role
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-readonly
rules:
  - apiGroups: ["", "apps", "autoscaling", "networking.k8s.io"]
    resources: ["pods", "pods/log", "services", "deployments", "replicasets", "events",
                "configmaps", "horizontalpodautoscalers", "ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-readonly
subjects:
  - kind: Group
    name: taskmanager-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: developer-readonly
  apiGroup: rbac.authorization.k8s.io
