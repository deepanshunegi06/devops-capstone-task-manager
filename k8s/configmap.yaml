# Non-sensitive configuration. Secrets (DB password, SECRET_KEY) live in the Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskmanager-config
data:
  LOG_LEVEL: "INFO"
  POSTGRES_DB: "taskmanager"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  GUNICORN_WORKERS: "2"
  GUNICORN_THREADS: "4"
  TOKEN_MAX_AGE: "86400"
  ADMIN_USERNAME: "admin"
