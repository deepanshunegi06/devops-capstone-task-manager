# NGINX Ingress: taskmanager.local -> live colour, preview.taskmanager.local -> idle colour.
# minikube: `minikube addons enable ingress` and add both hosts to /etc/hosts -> $(minikube ip)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskmanager
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: taskmanager.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskmanager
                port: { name: http }
    - host: preview.taskmanager.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskmanager-preview
                port: { name: http }
