{% extends "base.html" %}
{% block title %}{{ 'Edit' if task else 'New' }} task · Task Manager{% endblock %}
{% block content %}
{% set v = form if form else {} %}
<section class="card form-card">
  <h1>{{ 'Edit task' if task else 'New task' }}</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Title
      <input name="title" required maxlength="200" value="{{ v.get('title', task.title if task else '') }}">
    </label>
    <label>Description
      <textarea name="description" rows="4">{{ v.get('description', task.description if task else '') }}</textarea>
    </label>
    <div class="row">
      <label>Status
        <select name="status">
          {% set cur = v.get('status', task.status if task else 'todo') %}
          {% for s in statuses %}<option value="{{ s }}" {{ 'selected' if s == cur }}>{{ s.replace('_', ' ') }}</option>{% endfor %}
        </select>
      </label>
      <label>Priority
        <select name="priority">
          {% set curp = v.get('priority', task.priority if task else 'medium') %}
          {% for p in priorities %}<option value="{{ p }}" {{ 'selected' if p == curp }}>{{ p }}</option>{% endfor %}
        </select>
      </label>
      <label>Due date
        <input type="date" name="due_date" value="{{ v.get('due_date', task.due_date if task and task.due_date else '') }}">
      </label>
    </div>
    <div class="actions">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn" href="{{ url_for('web.dashboard') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
