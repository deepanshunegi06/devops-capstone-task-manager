{% extends "base.html" %}
{% block title %}Register · Task Manager{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Create account</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" required minlength="3" maxlength="80" autocomplete="username"></label>
    <label>Password <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn btn-primary" type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
