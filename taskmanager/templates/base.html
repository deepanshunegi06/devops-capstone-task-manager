<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#6d5cff">
  <title>{% block title %}Orbit · Task Manager{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/orbit.svg') }}" type="image/svg+xml">
  <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">
  {% block body %}
  <main class="auth-center">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  <footer class="auth-footer">
    Task Manager v{{ app_version }} &middot; <span class="color-tag color-{{ deploy_color }}">{{ deploy_color }}</span> deployment &middot; <a href="/health/ready">health check</a>
  </footer>
</body>
</html>
