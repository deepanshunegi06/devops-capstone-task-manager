# Static inventory example. `terraform apply` writes inventory/generated.ini with the real IPs:
#   ansible-playbook -i inventory/generated.ini site.yml
[control_plane]
k8s-master ansible_host=10.0.1.10

[workers]
k8s-worker-1 ansible_host=10.0.1.11
k8s-worker-2 ansible_host=10.0.1.12

[ci]
jenkins ansible_host=10.0.1.20

[k8s_cluster:children]
control_plane
workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/taskmanager.pem
