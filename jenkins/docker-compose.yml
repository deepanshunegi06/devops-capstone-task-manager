# CI tooling: Jenkins (configured as code) + SonarQube (+ its PostgreSQL).
#   cp jenkins/env.example jenkins/.env   # fill in the values
#   cp ~/.kube/config jenkins/kubeconfig  # git-ignored
#   docker compose -f jenkins/docker-compose.yml --env-file jenkins/.env up -d --build
# Jenkins: http://localhost:8081   SonarQube: http://localhost:9000 (admin/admin on first login)
# To expose the webhook endpoint to GitHub from a laptop: `ngrok http 8081`, then set JENKINS_URL.
name: ci

services:
  jenkins:
    build: .
    restart: unless-stopped
    user: root          # needed only to talk to the host Docker socket in this lab setup
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8081/}
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?required}
      JENKINS_DEV_PASSWORD: ${JENKINS_DEV_PASSWORD:?required}
      DOCKERHUB_USER: ${DOCKERHUB_USER:?required}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN:?required}
      GITHUB_USER: ${GITHUB_USER:?required}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?required}
      SONAR_TOKEN: ${SONAR_TOKEN:-generate-in-sonarqube-ui}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    secrets:
      - kubeconfig
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ci]

  sonarqube:
    image: sonarqube:10.7-community
    restart: unless-stopped
    depends_on: [sonar-db]
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?required}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
    networks: [ci]

  sonar-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?required}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    networks: [ci]

secrets:
  kubeconfig:
    file: ./kubeconfig

volumes:
  jenkins_home:
  sonar_data:
  sonar_extensions:
  sonar_db:

networks:
  ci:
