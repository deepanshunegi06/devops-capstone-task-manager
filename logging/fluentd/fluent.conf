# Fluentd pipeline for Docker Compose: receive -> parse -> enrich -> Elasticsearch
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Application logs are JSON lines - lift their fields (level, path, status, request_id...) to top level.
<filter taskmanager.app>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# Nginx access logs (combined format)
<filter taskmanager.nginx>
  @type parser
  key_name log
  reserve_data true
  emit_invalid_record_to_error false
  <parse>
    @type nginx
  </parse>
</filter>

<filter taskmanager.**>
  @type record_transformer
  <record>
    environment docker-compose
    source_tag ${tag}
  </record>
</filter>

<match taskmanager.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix taskmanager
  include_tag_key true
  suppress_type_name true
  <buffer>
    @type memory
    flush_interval 5s
    retry_max_interval 30s
    retry_forever true
  </buffer>
</match>
