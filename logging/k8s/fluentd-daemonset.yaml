# Fluentd DaemonSet: one collector per node. Collects
#   - container logs  : /var/log/containers/*.log (every pod, every namespace)
#   - application logs: Task Manager JSON lines are parsed into fields
#   - Kubernetes logs : kubelet + container runtime (systemd journal) and control-plane pods in kube-system
# and enriches each record with pod / namespace / labels via the kubernetes_metadata filter.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: logging
data:
  fluent.conf: |
    # ---------- container + application logs ----------
    <source>
      @type tail
      @id in_tail_containers
      path /var/log/containers/*.log
      exclude_path ["/var/log/containers/fluentd-*"]
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type multi_format
        <pattern>
          # containerd / CRI-O format
          format regexp
          expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[FP]) (?<log>.*)$/
          time_format %Y-%m-%dT%H:%M:%S.%N%:z
        </pattern>
        <pattern>
          # Docker json-file format
          format json
          time_key time
          time_format %Y-%m-%dT%H:%M:%S.%NZ
        </pattern>
      </parse>
    </source>

    # ---------- Kubernetes node logs (kubelet, container runtime) ----------
    <source>
      @type systemd
      @id in_systemd_kubelet
      path /var/log/journal
      matches [{ "_SYSTEMD_UNIT": "kubelet.service" }, { "_SYSTEMD_UNIT": "containerd.service" }]
      read_from_head false
      tag k8snode
      <storage>
        @type local
        persistent true
        path /var/log/fluentd-journald-k8s.pos
      </storage>
      <entry>
        fields_strip_underscores true
      </entry>
    </source>

    <filter kubernetes.**>
      @type kubernetes_metadata
      @id filter_kube_metadata
    </filter>

    # Task Manager pods write JSON - expand it into searchable fields.
    <filter kubernetes.var.log.containers.taskmanager-**>
      @type parser
      key_name log
      reserve_data true
      remove_key_name_field true
      emit_invalid_record_to_error false
      <parse>
        @type json
      </parse>
    </filter>

    <match kubernetes.var.log.containers.taskmanager-**>
      @type elasticsearch
      @id out_es_app
      host "#{ENV['FLUENT_ELASTICSEARCH_HOST']}"
      port "#{ENV['FLUENT_ELASTICSEARCH_PORT']}"
      logstash_format true
      logstash_prefix taskmanager-app
      suppress_type_name true
      <buffer>
        flush_interval 5s
        retry_forever true
      </buffer>
    </match>

    <match kubernetes.**>
      @type elasticsearch
      @id out_es_containers
      host "#{ENV['FLUENT_ELASTICSEARCH_HOST']}"
      port "#{ENV['FLUENT_ELASTICSEARCH_PORT']}"
      logstash_format true
      logstash_prefix k8s-containers
      suppress_type_name true
      <buffer>
        flush_interval 10s
        retry_forever true
      </buffer>
    </match>

    <match k8snode>
      @type elasticsearch
      @id out_es_node
      host "#{ENV['FLUENT_ELASTICSEARCH_HOST']}"
      port "#{ENV['FLUENT_ELASTICSEARCH_PORT']}"
      logstash_format true
      logstash_prefix k8s-node
      suppress_type_name true
    </match>
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: logging
  labels: { app: fluentd }
spec:
  selector:
    matchLabels: { app: fluentd }
  template:
    metadata:
      labels: { app: fluentd }
    spec:
      serviceAccountName: fluentd
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1.17-debian-elasticsearch8-1
          env:
            - { name: FLUENT_ELASTICSEARCH_HOST, value: elasticsearch.logging.svc.cluster.local }
            - { name: FLUENT_ELASTICSEARCH_PORT, value: "9200" }
          resources:
            requests: { cpu: 100m, memory: 200Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /fluentd/etc/fluent.conf, subPath: fluent.conf }
            - { name: varlog, mountPath: /var/log }
            - { name: containers, mountPath: /var/lib/docker/containers, readOnly: true }
      volumes:
        - name: config
          configMap: { name: fluentd-config }
        - name: varlog
          hostPath: { path: /var/log }
        - name: containers
          hostPath: { path: /var/lib/docker/containers }
