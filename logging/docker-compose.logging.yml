# Centralized logging overlay (EFK: Elasticsearch + Fluentd + Kibana) for Docker Compose.
#   docker compose -f docker-compose.yml -f logging/docker-compose.logging.yml up -d --build
# Kibana: http://localhost:5601  -> Stack Management -> Data views -> create "taskmanager-*"
#
# The app, db and nginx containers switch from the json-file driver to the fluentd driver,
# so every container's stdout/stderr is shipped to Fluentd, parsed and indexed in Elasticsearch.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Lab setting: ES is only reachable on the internal 'backend' network (no published port).
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30
    networks: [backend]

  fluentd:
    build: ./logging/fluentd
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:24224:24224"        # Docker daemon -> Fluentd (fluentd log driver)
      - "127.0.0.1:24224:24224/udp"
    volumes:
      - ./logging/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
    networks: [backend]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    restart: unless-stopped
    depends_on: [elasticsearch]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks: [backend]

  app:
    depends_on: [fluentd]
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async: "true"
        tag: taskmanager.app

  db:
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async: "true"
        tag: taskmanager.db

  nginx:
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async: "true"
        tag: taskmanager.nginx

volumes:
  es_data:
