global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: taskmanager

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application metrics (request rate, latency, errors, tasks by status)
  - job_name: taskmanager
    metrics_path: /metrics
    static_configs:
      - targets: ["app:5000"]
        labels: { service: taskmanager }

  # Host CPU / memory
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Container CPU / memory / health
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
