# Prometheus + Grafana on Kubernetes via the kube-prometheus-stack Helm chart.
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   kubectl create secret generic grafana-admin -n monitoring \
#       --from-literal=admin-user=admin --from-literal=admin-password="$(openssl rand -hex 12)"
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#       -n monitoring --create-namespace -f monitoring/k8s/kube-prometheus-values.yaml
#   kubectl apply -f monitoring/k8s/
# Includes node-exporter (host CPU/memory), kubelet/cAdvisor (container CPU/memory) and
# kube-state-metrics (pod readiness, restarts = container health).
prometheus:
  prometheusSpec:
    retention: 7d
    # pick up ServiceMonitors / PrometheusRules from every namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  service:
    type: NodePort
    nodePort: 32000

alertmanager:
  enabled: true
