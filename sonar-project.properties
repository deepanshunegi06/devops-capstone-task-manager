# SonarQube project configuration (used by `sonar-scanner` in the Jenkins pipeline).
# Server URL and token are injected by withSonarQubeEnv('sonarqube') - never stored here.
sonar.projectKey=taskmanager
sonar.projectName=Task Manager (ENSP461 Capstone)
sonar.sources=taskmanager
sonar.tests=tests
sonar.language=py
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
sonar.python.bandit.reportPaths=reports/bandit.json
sonar.exclusions=**/static/**
sonar.qualitygate.wait=false
